spring:
  datasource:
    url: jdbc:h2:mem:flowguard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

flowguard:
  engine:
    worker-id: test-worker-1
    lease-duration-seconds: 1
    recovery-interval-seconds: 1
    retry-poll-interval-seconds: 1
    allow-failure-injection: true
    retry:
      max-attempts: 3
      initial-delay-seconds: 1
      multiplier: 2.0
      max-delay-seconds: 5
      jitter-factor: 0.0
